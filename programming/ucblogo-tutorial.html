    {t:"p", v:"The fourth is <strong>procedure-text form</strong>, a variant of lambda form used by DEFINE and TEXT, where the template list has at least two members, all of which are lists. Logo treats this as its own independent defined procedure for OUTPUT/STOP purposes — so a named-slot template like <em>[[x] :x+3]</em> lets the expression's value flow out normally, while a procedure-text template like <em>[[x] [output :x+3]]</em> must use OUTPUT explicitly, exactly as a real TO-defined procedure would."},
    {t:"p", v:"<strong>apply template inputlist</strong> is the foundational tool: it fills the template's slots with inputlist's members (whose count must be an acceptable number of slots) and outputs whatever the template outputs, if anything. (Applying the special form TO is illegal; anything else is fine.) The library's <strong>invoke template input1 input2 ...</strong> does the same but with inputs given as separate arguments rather than packed into one list."},
    {t:"p", v:"<strong>foreach data template</strong> (or with several parallel data lists) runs the template once per member (or, for a word input, once per character). Two special template symbols are available inside FOREACH, MAP, and MAP.SE: <strong>?rest</strong> represents everything in the data to the right of the current slot-filler, and <strong>#</strong> represents the current slot-filler's position (1-based) within the data."},
    {t:"p", v:"<strong>map template data</strong> (or several data inputs in parallel) outputs a word or list of the same length as the data, each member being the template's result for the corresponding input(s); when producing a word, template results must themselves be words, concatenated with WORD. <strong>map.se template data</strong> instead concatenates results with SENTENCE, so the output can be a different length than the input (an empty-list result contributes nothing)."},
    {t:"p", v:"<strong>filter tftemplate data</strong> outputs the subsequence of members/characters for which the template evaluates TRUE:"},
    {t:"code", v:"? print filter \"vowelp \"elephant\neea"},
    {t:"p", v:"<strong>find tftemplate data</strong> outputs the first constituent for which the template is TRUE, or the empty list if none qualifies."},
    {t:"p", v:"<strong>reduce template data</strong> accumulates a two-slot template across the data, right to left conceptually: with one constituent, that's the output; otherwise the template first combines the last two constituents, then combines that result with the next one to the left, and so on until the data is exhausted (which must be nonempty). REDUCE suits associative two-input functions:"},
    {t:"code", v:"to max :a :b\noutput ifelse :a > :b [:a] [:b]\nend\nprint reduce \"max [3 9 2 7]      ; 9"},
    {t:"p", v:"<strong>crossmap template listlist</strong> (or several data lists) outputs a list from evaluating the template across <em>every combination</em> of members across the data lists, unlike MAP's parallel (same-position) pairing — the data lists need not be the same length:"},
    {t:"code", v:"? show (crossmap [word ?1 ?2] [a b c] [1 2 3 4])\n[a1 a2 a3 a4 b1 b2 b3 b4 c1 c2 c3 c4]"},
    {t:"p", v:"<strong>cascade endtest template startvalue</strong> repeatedly applies a one-slot template, first filling the slot with startvalue, then with each prior result, for either a fixed count (if endtest is a nonnegative integer) or until a predicate endtest template becomes TRUE. Inside a CASCADE template, <strong>#</strong> represents the 1-based count of evaluations so far:"},
    {t:"code", v:"? show cascade 5 [# * ?] 1\n120\n; equivalent to 5 factorial: 1*1, 2*2, 3*6, 4*24, 5*120\n\nto fibonacci :n\noutput (cascade :n [?1 + ?2] 1 [?1] 0)\nend"},
    {t:"p", v:"Additional template/startvalue pairs can be given to CASCADE to compute several cascaded results in parallel — <strong>cascade.2</strong> is a library shortcut with the same behavior but a default of five inputs instead of three."},
    {t:"p", v:"<strong>transfer endtest template inbasket</strong> evaluates a template once per member of <em>inbasket</em>, threading an accumulating <em>outbasket</em> (initially empty) through each step. Inside its template, <strong>?in</strong> represents the current inbasket member and <strong>?out</strong> represents the entire current outbasket. If endtest is the empty list, TRANSFER processes every inbasket member; otherwise it's a predicate template, and processing stops early once it becomes TRUE."}
  ],
  quiz:[
    {q:"What distinguishes the explicit-slot (?) template form from named-procedure form?", opts:["They cannot both be used with MAP", "Explicit-slot form uses a list with ? markers filled by data; named-procedure form uses a bare word naming a procedure applied to the data", "Named-procedure form is only for FOREACH, never MAP", "There is no difference between them"], a:1,
     ex:"[? * ?] is a list template with question-mark slots, while a bare word like \"word is taken as the name of a procedure to apply directly to the available data — two different template mechanisms serving the same iteration tools."},
    {q:"How does CROSSMAP differ from MAP when given multiple data list inputs?", opts:["CROSSMAP and MAP behave identically", "MAP pairs data from each list by matching position (parallel); CROSSMAP evaluates the template across every possible combination of members from the lists", "CROSSMAP requires all lists to be the same length while MAP does not", "MAP only works with two data lists; CROSSMAP requires exactly three"], a:1,
     ex:"MAP walks multiple data lists in lockstep, combining same-position elements; CROSSMAP instead produces one result for every combination of elements across the lists, which need not even be the same length."},
    {q:"Inside a REDUCE template applied to `[3 9 2 7]` with a two-input MAX function, what is the general accumulation order?", opts:["Left to right only, one pass, no intermediate results", "Conceptually starts by combining the last two constituents, then folds in remaining constituents from the right going left, carrying the running result forward", "REDUCE requires exactly two data elements, no more", "REDUCE ignores the actual values and just counts elements"], a:1,
     ex:"REDUCE applies its two-slot template starting with the last two constituents, then repeatedly combines the running result with the next constituent to its left, continuing until all constituents have been folded in."}
  ]
},
{
  id:"macros", file:"CH10.LOGO", num:"10", title:"Macros",
  subtitle:"Building new control structures whose output is evaluated as instructions in the caller's context.",
  body:[
    {t:"p", v:"A <strong>macro</strong> is a special kind of procedure whose <em>output</em> is evaluated as Logo instructions in the context of the macro's caller, rather than being used as an ordinary return value. <strong>.macro procname :input1 :input2 ...</strong> (a special form) works exactly like TO, except the new procedure becomes a macro; <strong>.defmacro procname text</strong> is exactly like DEFINE, with the same exception. Both names start with a dot, marking macros as an advanced, easy-to-misuse feature — a badly written macro can fail to terminate, or fail to construct its output instruction list correctly."},
    {t:"p", v:"Macros exist because ordinary procedures can almost, but not quite, duplicate control structures like REPEAT or IF. Consider an ordinary-procedure reimplementation of REPEAT:"},
    {t:"code", v:"to my.repeat :num :instructions\nif :num=0 [stop]\nrun :instructions\nmy.repeat :num-1 :instructions\nend"},
    {t:"p", v:"This works for simple cases like <em>my.repeat 5 [print \"hello]</em>, but breaks if the repeated instructions themselves need to use OUTPUT, STOP, or LOCAL — because those would affect MY.REPEAT's own execution, not the caller's. For example, a procedure using REPEAT with an embedded STOP to exit early works correctly with the real REPEAT, but would incorrectly stop MY.REPEAT instead of the outer procedure if MY.REPEAT were substituted."},
    {t:"p", v:"The fix is to make MY.REPEAT a <strong>macro</strong>. Instead of performing the computation directly, a macro returns a <em>list of Logo instructions</em>, which get evaluated as though they appeared in place of the macro call itself:"},
    {t:"code", v:".macro my.repeat :num :instructions\nif :num=0 [output []]\noutput sentence :instructions ~\n                (list \"my.repeat :num-1 :instructions)\nend"},
    {t:"p", v:"Every macro is necessarily an operation — it must always output <em>something</em>, even if that something is just an empty instruction list in the base case. For <em>my.repeat 5 [print \"hello]</em>, the macro outputs <em>[print \"hello my.repeat 4 [print \"hello]]</em>, and Logo runs those instructions in place of the original call — printing hello once, then recursing for the next repetition."},
    {t:"p", v:"This simple technique is slow, since every repetition constructs a fresh instruction list. A faster approach makes MY.REPEAT behave like the non-macro version unless OUTPUT or STOP actually occurs inside the repeated instructions, using CATCH/THROW to detect the difference and only construct special output instructions when truly needed."},
    {t:"p", v:"Here's a second illustrative macro, avoiding a quoting headache for MAKE's second input:"},
    {t:"code", v:".macro localmake :name :value\noutput (list \"local          ~\n             word \"\" :name   ~\n             \"apply          ~\n                \"make          ~\n                (list :name :value))\nend"},
    {t:"p", v:"Calling <em>localmake \"garply \"hello</em> outputs <em>[local \"garply apply \"make [garply hello]]</em> — using APPLY sidesteps having to decide in advance whether MAKE's second input needs a quotation mark (it would if the value were a word, but not if it were a list). The backquote (`) tool often simplifies constructing such instruction lists, though it's comparatively slow, being tree-recursive and written in Logo itself:"},
    {t:"code", v:".macro localmake :name :value\nop `[local ,[word \"\" :name] apply \"make [,[:name] ,[:value]]]\nend"},
    {t:"p", v:"Important: Logo macros, unlike Lisp macros, are <strong>not special forms</strong> — a macro's inputs are evaluated normally, exactly as for any other procedure. It's only the macro's <em>output</em> that receives special treatment (being run as instructions rather than returned as data)."},
    {t:"p", v:"<strong>.defmacro</strong> is DEFINE's macro equivalent, mentioned above. <strong>macrop name</strong> (MACRO?) outputs TRUE if a name refers to a macro. The library's <strong>macroexpand expr</strong> takes an expression that invokes a macro and outputs the Logo expression the macro would translate it into — useful for debugging what a macro actually produces:"},
    {t:"code", v:".macro localmake :name :value\nop `[local ,[word \"\" :name] apply \"make [,[:name] ,[:value]]]\nend\n\n? show macroexpand [localmake \"pi 3.14159]\n[local \"pi apply \"make [pi 3.14159]]"}
  ],
  quiz:[
    {q:"What is fundamentally different about a macro's output compared to an ordinary procedure's output?", opts:["Macros can never output anything at all", "A macro's output is evaluated as Logo instructions in the caller's own context, rather than simply being returned as a value", "Macro output must always be a single number", "There is no difference — macros and procedures behave identically"], a:1,
     ex:"Where a normal procedure's OUTPUT just hands back a value to the caller, a macro's output is itself treated as a list of instructions and run as if it had appeared directly where the macro was called — which is what lets a macro-based REPEAT support an embedded STOP or OUTPUT that affects the caller, not the macro itself."},
    {q:"Why does an ordinary-procedure version of REPEAT fail when its instructions include STOP?", opts:["STOP is not a valid Logo primitive", "STOP would end the REPEAT-like procedure itself, rather than the outer procedure that called it, because it isn't a macro", "Procedures can never contain a REPEAT call", "STOP only works inside macros, never inside procedures"], a:1,
     ex:"Since MY.REPEAT (as an ordinary procedure) is just another procedure call, a STOP inside the repeated instructions stops MY.REPEAT's own execution rather than propagating out to stop the procedure that originally called MY.REPEAT — only the macro version correctly lets STOP escape to the true caller."},
    {q:"Are the inputs to a Logo macro evaluated differently from inputs to an ordinary procedure?", opts:["Yes, macro inputs are never evaluated at all", "No — macro inputs are evaluated completely normally; only the macro's output receives special treatment", "Yes, macro inputs are always doubly-evaluated", "Macros cannot accept any inputs"], a:1,
     ex:"The manual explicitly notes that, unlike Lisp macros, Logo macros are not special forms — their inputs go through the same ordinary evaluation as any other procedure call. The special handling applies only to what the macro outputs."}
  ]
},
{
  id:"errors", file:"CH11.LOGO", num:"11", title:"Error Processing",
  subtitle:"How Logo handles errors, ERRACT, and the full table of numbered error codes.",
  body:[
    {t:"p", v:"When an error occurs, Logo first checks whether the special variable <strong>erract</strong> exists. If so, its value is taken as an instructionlist and run; the operation <strong>error</strong> can be used once within those instructions to examine the error condition. If the ERRACT instructions invoke PAUSE, the error message is printed <em>before</em> the pause begins. For certain recoverable error types, if the ERRACT instructionlist outputs a value, that value is substituted in place of the expression that caused the error in the first place — effectively letting you patch around the problem interactively (if ERRACT invokes PAUSE and the user then calls CONTINUE with an input, that input becomes PAUSE's output, and therefore ERRACT's output)."},
    {t:"p", v:"To guard against infinite loops from a misbehaving ERRACT (one that produces an inappropriate or missing value, causing the same error to recur), Logo detects when the identical error condition happens twice in a row from an ERRACT instructionlist with no user interaction in between; in that case it prints '<em>Erract loop</em>' and returns to toplevel rather than looping forever. \"Without user interaction\" specifically means: if ERRACT invokes PAUSE and the user supplies an incorrect value, that doesn't count as the loop-breaking condition — the user gets to try again."},
    {t:"p", v:"While ERRACT's own instructionlist is running, <strong>erract is temporarily unbound</strong> — so an error occurring within the ERRACT-handling code itself won't recursively trigger ERRACT again. In particular, an error during a pause won't cause a pause-within-a-pause, unless the user explicitly reassigns <em>[pause]</em> to ERRACT while already inside the pause; even then, such a nested error stays within the original pause loop rather than returning to toplevel."},
    {t:"p", v:"If there is no available ERRACT value, Logo instead generates an internal <strong>throw \"error</strong> (a user program can also deliberately trigger this same mechanism by calling THROW itself). If nothing catches this throw with a <em>catch \"error</em>, it eventually reaches either the toplevel loop or an active pause loop, either of which prints the error message. Calling CATCH \"ERROR in a user program locally unbinds ERRACT for the duration, so whichever of ERRACT or CATCH \"ERROR is more locally in scope takes precedence over the other."},
    {t:"p", v:"A special note on floating-point errors: if an arithmetic overflow occurs, or a two-input math function like POWER receives an illegal combination of inputs, the resulting \"doesn't like\" error message technically names the <em>second</em> operand — but should really be understood as describing the combination of both inputs together, not a fault purely in the second one."},
    {t:"p", v:"<strong>Error Codes</strong> — every error Logo can raise has a numeric code, used as the first member of the list output by ERROR. Some codes appear twice, once for a recoverable and once for a non-recoverable variant of essentially the same condition; some are warnings, not true errors, and are never caught. Codes 0 and 32 are so severe that Logo exits immediately, uncatchable:"},
    {t:"code", v:"0  Fatal internal error              (can't be caught)\n1  Out of memory\n2  Stack overflow\n3  Turtle out of bounds\n4  proc doesn't like datum as input   (not recoverable)\n5  proc didn't output to proc\n6  Not enough inputs to proc\n7  proc doesn't like datum as input   (recoverable)\n8  Too much inside ()'s\n9  You don't say what to do with datum\n10 ')' not found\n11 var has no value\n12 Unexpected ')'\n13 I don't know how to proc           (recoverable)\n14 Can't find catch tag for throwtag\n15 proc is already defined\n16 Stopped\n17 Already dribbling\n18 File system error\n19 Assuming you mean ifelse, not if   (warning only)\n20 var shadowed by local in procedure call (warning only)\n21 Throw \"Error\n22 proc is a primitive\n23 Can't use to inside a procedure\n24 I don't know how to proc           (not recoverable)\n25 iftrue/iffalse without test\n26 Unexpected ']'\n27 Unexpected '}'\n28 Couldn't initialize graphics\n29 Macro returned value instead of a list\n30 You don't say what to do with value\n31 Can only use stop or output inside a procedure\n32 apply doesn't like badthing as input  (can't be caught)\n33 end inside multi-line instruction\n34 Really out of memory                  (can't be caught)\n35 user-generated error message (throw \"error message)\n36 end inside multi-line instruction\n37 Bad default expression for optional input\n38 Can't use output or stop inside runresult\n39 Assuming you meant 'fd 100', not fd100 (or similar)\n40 I can't open file filename\n41 File filename already open\n42 File filename not open\n43 Runlist has more than one expression"}
  ],
  quiz:[
    {q:"What happens to the special variable ERRACT while its own instructionlist is running?", opts:["It becomes TRUE automatically", "It is temporarily unbound, preventing an error inside the error-handling code from recursively re-triggering ERRACT", "It is deleted permanently", "It is automatically set to [PAUSE]"], a:1,
     ex:"Logo locally unbinds ERRACT during its own execution specifically to prevent a bug in the error handler itself from causing infinite recursive error handling."},
    {q:"What message does Logo print, and what does it do, if the same error condition recurs twice in a row from ERRACT with no user interaction?", opts:["It silently ignores the second occurrence and continues", "It prints 'Erract loop' and returns to toplevel, to prevent an infinite loop", "It crashes with a fatal internal error", "It automatically increases the recursion limit and keeps trying"], a:1,
     ex:"This safeguard exists because a broken ERRACT could otherwise cause the same error to recur forever; detecting two identical consecutive occurrences without intervening user interaction triggers an 'Erract loop' message and a return to toplevel."},
    {q:"According to the error code table, which two error codes are described as so severe that they cannot be caught at all?", opts:["Codes 13 and 24", "Codes 0 and 32 (also 34, 'Really out of memory')", "Codes 19 and 20", "Codes 40 and 41"], a:1,
     ex:"The manual specifically marks error 0 (Fatal internal error) and error 32 (or 34, Really out of memory) as uncatchable, causing Logo to exit immediately rather than allowing any CATCH or ERRACT mechanism to intervene."}
  ]
},
{
  id:"specialvars", file:"CH12.LOGO", num:"12", title:"Special Variables",
  subtitle:"Reserved variable names that Logo treats specially, and the two read-only version variables.",
  body:[
    {t:"p", v:"Logo takes special action whenever certain reserved variable names exist. These follow normal dynamic-scope rules, so a procedure can locally set one of them to limit the effect to just its own (and its subprocedures') execution. Initially, no special variables exist except <strong>allowgetset</strong>, <strong>caseignoredp</strong>, and <strong>unburyonedit</strong>, which all start out TRUE and buried."},
    {t:"p", v:"<strong>allowgetset</strong> — if TRUE, an attempt to call a nonexistent procedure is instead treated as an implicit getter or setter for a same-named variable (a setter specifically when the name's first three letters are SET), as detailed in Lesson 1."},
    {t:"p", v:"<strong>buttonact</strong> — if nonempty, an instructionlist evaluated whenever a mouse button is pressed (the user may have already released the button by the time it actually runs; BUTTON still reports which button was most recently pressed, and CLICKPOS the position at that moment, which can differ from the current MOUSEPOS if the mouse has since moved). Because a new button-press during the instructionlist's own execution could cause confusing re-entrant behavior, a common safeguard is to temporarily clear BUTTONACT to the empty list for the duration:"},
    {t:"code", v:"make \"buttonact [button.action]\n\nto button.action [:buttonact []]\n... ; whatever you want the button to do\nend"},
    {t:"p", v:"<strong>caseignoredp</strong> — if TRUE (the default, and buried from the start), upper- and lower-case letters are treated as equal by EQUALP, BEFOREP, MEMBERP, and similar comparison primitives."},
    {t:"p", v:"<strong>commandline</strong> — holds any text following a hyphen on the command line used to start Logo."},
    {t:"p", v:"<strong>erract</strong> — an instructionlist run automatically whenever an error occurs; typically set to <em>[pause]</em> to enable interactive debugging, as covered in the previous lesson."},
    {t:"p", v:"<strong>fullprintp</strong> — if TRUE, words built using backslash or vertical bars print with those characters visible, so the printed form could be re-read to reproduce an identical value; under FULLPRINTP, the empty word specifically prints as <em>||</em> rather than as nothing."},
    {t:"p", v:"<strong>keyact</strong> — if nonempty, an instructionlist evaluated whenever a character-producing key is pressed (SHIFT or CONTROL alone don't count); the instructionlist can call READCHAR to discover which key. As with BUTTONACT, a key pressed during the instructionlist's own execution could re-trigger it, so the same temporary-clear pattern is recommended."},
    {t:"p", v:"<strong>loadnoisily</strong> — if TRUE, prints the name of each procedure as it's defined while loading from a file, including the temporary file EDIT creates."},
    {t:"p", v:"<strong>printdepthlimit</strong> and <strong>printwidthlimit</strong> — if set to a nonnegative integer, cap the maximum nesting depth or maximum member count that PRINT (and friends) will actually display, substituting ellipses for anything past the limit — covered in the Communication lesson."},
    {t:"p", v:"<strong>redefp</strong> — if TRUE, permits primitives to be erased with ERASE or redefined with COPYDEF, which is disallowed by default to prevent accidental clobbering of built-in behavior."},
    {t:"p", v:"<strong>startup</strong> — if a file loaded via LOAD assigns this variable a list value, that list is automatically run as an instructionlist immediately after the file finishes loading."},
    {t:"p", v:"<strong>unburyonedit</strong> — if TRUE (the default, buried), causes any procedure defined while inside EDIT or LOAD to be automatically unburied, ensuring it will be included in a later SAVE. Files intending to both define and then bury procedures must do those two things in that specific order."},
    {t:"p", v:"<strong>usealternatenames</strong> — if TRUE, causes Logo to generate non-English words (drawn from the Messages file) in place of TRUE, FALSE, END, and similar built-in vocabulary — see the Internationalization lesson."},
    {t:"p", v:"Two further buried variables are provided purely for programs to query, not to configure: <strong>logoversion</strong>, a real number giving the running Logo's version (e.g. 5.5), and <strong>logoplatform</strong>, one of the words <em>wxWidgets</em>, <em>x11</em>, <em>Windows</em>, or <em>Unix-nographics</em>, identifying which build of Logo is running."}
  ],
  quiz:[
    {q:"Which three special variables exist by default from the moment Logo starts, and what is true of all three initially?", opts:["ERRACT, STARTUP, and REDEFP — all initially FALSE", "ALLOWGETSET, CASEIGNOREDP, and UNBURYONEDIT — all initially TRUE and buried", "LOGOVERSION, LOGOPLATFORM, and COMMANDLINE — all initially empty", "PRINTDEPTHLIMIT, PRINTWIDTHLIMIT, and FULLPRINTP — all initially set to 0"], a:1,
     ex:"The manual states that initially no special variables exist except ALLOWGETSET, CASEIGNOREDP, and UNBURYONEDIT, which are all TRUE and buried by default — every other special variable must be explicitly created before it has any effect."},
    {q:"Why would a programmer temporarily set BUTTONACT to the empty list inside the very instructionlist that BUTTONACT itself triggers?", opts:["It's required syntax with no functional purpose", "To prevent a new button press occurring during that instructionlist's own execution from causing confusing re-entrant triggering", "BUTTONACT must always be emptied immediately after any use", "This has no relationship to BUTTONACT's actual behavior"], a:1,
     ex:"Since it's possible for the user to press a button again while the BUTTONACT instructions are still running, temporarily clearing BUTTONACT during that execution avoids a potentially confusing re-entrant re-triggering of the same handler."},
    {q:"What does REDEFP control, and what is its default state?", opts:["Whether variables can be renamed; defaults to TRUE", "Whether primitive procedures can be erased or redefined; defaults to FALSE (disallowed) to prevent accidental clobbering", "Whether the turtle can move past screen edges; defaults to TRUE", "Whether comments are allowed in procedure definitions; defaults to FALSE"], a:1,
     ex:"REDEFP gates whether ERASE or COPYDEF may target a built-in primitive; it isn't in the initially-TRUE trio, so by default this protection against accidentally overwriting primitives is active."}
  ]
},
{
  id:"i18n", file:"CH13.LOGO", num:"13", title:"Internationalization",
  subtitle:"Adapting Berkeley Logo's primitive names, error messages, and documentation for other languages.",
  body:[
    {t:"p", v:"Berkeley Logo has limited support for non-English-speaking users — notably, there is <strong>no Unicode support</strong>, and high-bit-on ASCII codes work in some contexts but not others. Translating Berkeley Logo for another language involves three separate tasks: primitive names, error (and other system) messages, and documentation."},
    {t:"p", v:"<strong>Primitive names</strong>: the simplest approach is a startup file defining aliases for the English names using COPYDEF:"},
    {t:"code", v:"copydef \"avant \"forward"},
    {t:"p", v:"This suffices unless your language's name for one primitive happens to be spelled like the English name of a <em>different</em> primitive — in that case you must turn on REDEFP and be careful to copy the non-conflicting name first, before overwriting the conflicting one. \"Primitives\" that are actually library procedures can simply be replaced or supplemented with native-language-named Logo procedures and matching filenames. Of course, Logo code still won't read like a sentence in your native language if word order differs substantially — especially in languages that don't put verbs before their objects."},
    {t:"p", v:"<strong>Error messages</strong> live in a file named <strong>Messages</strong> in the logolib directory, one message per line; you can substitute your own translated file. Lines must not be added, deleted, or reordered, since Logo locates messages purely by line number. Special sequences <em>%p</em>, <em>%s</em>, and <em>%t</em> mark variable parts of a message and must not be translated: %p PRINTs the variable part, %s SHOWs it (i.e., whether brackets are shown around a list), and %t means the variable part is a raw C text string rather than a Logo object."},
    {t:"p", v:"If you need to reverse the order of two variable parts within a message (no message needs more than two), a leading plus sign after the first percent sign signals the reversal — for instance replacing"},
    {t:"code", v:"%p doesn't like %s as input"},
    {t:"p", v:"with"},
    {t:"code", v:"%+s is a lousy input to %p"},
    {t:"p", v:"The sequence <em>\\n</em> within a message represents a newline character — don't mistake the <em>n</em> for part of the following word. Some messages deliberately appear twice (not a mistake); the message containing only <em>%p</em> is specifically for user-supplied error text via <em>throw \"error</em>; a fixed phrase indicating where in a procedure an error occurred can be localized too (e.g., translating the word \"in\"); and the phrase LOAD prints for each defined procedure when LOADNOISILY is TRUE, and the template EDIT writes for a not-yet-defined procedure, are both also configurable this way."},
    {t:"p", v:"The Messages file also contains single-word lines — starting with the word <em>true</em> — some recognized by Logo in user input, some generated by Logo as output, some both. For example, TRUE and FALSE are recognized as boolean values by IF/IFELSE and are also generated as outputs by predicates like EQUALP; END is recognized as ending a procedure definition and may be regenerated by PO or EDIT. Replacing an English word with a translation means Logo will recognize <strong>both</strong> the English original and your new alternate — for example, replacing <em>true</em> with <em>vrai</em> means both <em>if \"true [...]</em> and <em>if \"vrai [...]</em> work."},
    {t:"p", v:"The variable <strong>usealternatenames</strong> controls whether Logo <em>generates</em> other-language words as output (for example, whether predicate functions return the alternate-language TRUE/FALSE) — it's FALSE by default, so English words are generated even after translation. A middle path is possible: leave USEALTERNATENAMES FALSE, keep English-named predicates producing English TRUE/FALSE, but define separate other-language-named predicate wrappers that translate their result:"},
    {t:"code", v:"to french.boolean :bool\nif equalp :bool \"true [output \"vrai]\nif equalp :bool \"false [output \"faux]\noutput :bool\nend\n\nto make.french.predicate :french :english :arity\ndefine :french `[[[inputs] ,[:arity]]\n                 [output french.boolean\n    apply ,[word \"\" :english] :inputs]]\nend\n\n? make.french.predicate \"egal? \"equal? 2\n? pr egal? 3 4\nfaux\n? pr equal? 3 4\nfalse"},
    {t:"p", v:"This approach isn't perfect, since infix predicates (<em>=</em>, <em>&lt;</em>, <em>&gt;</em>) would still output English regardless — achieving fully alternate-language infix output requires setting USEALTERNATENAMES to TRUE instead. Some words in the Messages file are themselves the names of Logo primitives (OUTPUT, STOP, GOTO, TAG, IF, IFELSE, TO, .MACRO) — translating these requires <em>both</em> the COPYDEF step described earlier <em>and</em> a consistent change in Messages, including remembering the period in <em>.macro</em>."},
    {t:"p", v:"<strong>Documentation</strong> comes in two forms: this manual, and the individual HELP files. On Unix, help files are generated automatically from the manual itself, so translating just the manual (while preserving its exact formatting — the generator notices capital letters, tabs, hyphens, and equal signs at the start of lines) is sufficient. The <em>makefile.c</em> build script may need adjustment, since a few primitive names are special cases (LOG10 being the only name containing digits). Without Unix tools, individual help files can be translated one at a time; a period within a primitive's name becomes the letter D in its help filename, and there are no separate files for question-mark names, since HELP looks for the file matching the corresponding P-suffixed name instead."}
  ],
  quiz:[
    {q:"What do the sequences %p, %s, and %t represent inside a Messages file entry, and should they be translated?", opts:["They are typos and should be deleted", "They mark variable parts of a message (PRINT-style, SHOW-style, or raw C text respectively) and must NOT be translated", "They are optional decorative characters with no functional meaning", "They represent line numbers within the file"], a:1,
     ex:"%p, %s, and %t are functional placeholders — controlling how the variable part of a message is displayed (printed, shown with brackets, or inserted as raw text) — and translating or altering them would break the message substitution mechanism."},
    {q:"If you replace the English word \"true\" with \"vrai\" in the Messages file, what happens to code using the original English word?", opts:["The English word \"true\" stops working entirely, only \"vrai\" is recognized", "Logo recognizes BOTH the English word and the new alternate word", "Logo now requires \"vrai\" to be capitalized differently than \"true\" was", "Nothing changes since Messages file edits require a full reinstall"], a:1,
     ex:"The manual specifically notes that replacing an English word with a non-English alternative in Messages causes Logo to recognize both the English original and the new alternate name going forward."},
    {q:"What does the special variable USEALTERNATENAMES control?", opts:["Whether Logo accepts alternate-language names as INPUT — this is always allowed regardless of the setting", "Whether Logo GENERATES alternate-language words (like a translated TRUE/FALSE) as OUTPUT from predicates and primitives", "Whether comments can be written in a non-English language", "Whether the manual itself displays in translated form"], a:1,
     ex:"Recognizing alternate names as input always works once they're defined in Messages; USEALTERNATENAMES specifically governs whether Logo's own generated output (e.g., what a predicate returns) uses the alternate-language words instead of the English defaults."}
  ]
}
];

const REFERENCE = "\n<p style=\"color:#5f6472; font-size:.95rem; margin-top:0;\">Quick reference compiled by <strong>Jan Savage</strong> for this interactive UCB Logo tutor. Covers every primitive and library procedure in the Berkeley Logo 6.2 manual.</p>\n\n<h3>Ch.1 &mdash; Syntax Essentials</h3>\n<table>\n<tr><td class=\"k\">MAKE \"name val</td><td class=\"v\">assign a global variable</td></tr>\n<tr><td class=\"k\">THING \"name / :name</td><td class=\"v\">read a variable's value</td></tr>\n<tr><td class=\"k\">TO / END</td><td class=\"v\">define a procedure</td></tr>\n<tr><td class=\"k\">SETFOO val</td><td class=\"v\">getter/setter shorthand for MAKE \"FOO val</td></tr>\n<tr><td class=\"k\">; comment</td><td class=\"v\">rest of line ignored</td></tr>\n<tr><td class=\"k\">~</td><td class=\"v\">line continuation</td></tr>\n<tr><td class=\"k\">\\ char / |chars|</td><td class=\"v\">escape / literal delimiters</td></tr>\n</table>\n\n<h3>Ch.2 &mdash; Data Structures</h3>\n<table>\n<tr><td class=\"k\">WORD, LIST, SENTENCE (SE)</td><td class=\"v\">constructors</td></tr>\n<tr><td class=\"k\">FPUT, LPUT</td><td class=\"v\">add to front/back of list</td></tr>\n<tr><td class=\"k\">ARRAY, MDARRAY, LISTTOARRAY, ARRAYTOLIST</td><td class=\"v\">arrays</td></tr>\n<tr><td class=\"k\">COMBINE, REVERSE, GENSYM</td><td class=\"v\">library constructors</td></tr>\n<tr><td class=\"k\">FIRST, LAST, BUTFIRST (BF), BUTLAST (BL)</td><td class=\"v\">selectors</td></tr>\n<tr><td class=\"k\">FIRSTS, BUTFIRSTS (BFS)</td><td class=\"v\">map FIRST/BUTFIRST over a list</td></tr>\n<tr><td class=\"k\">ITEM, MDITEM, PICK, REMOVE, REMDUP, QUOTED</td><td class=\"v\">more selectors</td></tr>\n<tr><td class=\"k\">SETITEM, .SETFIRST, .SETBF, .SETITEM</td><td class=\"v\">mutators (dotted = dangerous)</td></tr>\n<tr><td class=\"k\">PUSH, POP, QUEUE, DEQUEUE</td><td class=\"v\">stack/queue helpers</td></tr>\n<tr><td class=\"k\">WORDP, LISTP, ARRAYP, EMPTYP, EQUALP, NOTEQUALP</td><td class=\"v\">type/equality predicates</td></tr>\n<tr><td class=\"k\">BEFOREP, .EQ, MEMBERP, SUBSTRINGP, NUMBERP, VBARREDP</td><td class=\"v\">more predicates</td></tr>\n<tr><td class=\"k\">COUNT, ASCII, RAWASCII, CHAR, MEMBER</td><td class=\"v\">queries</td></tr>\n<tr><td class=\"k\">LOWERCASE, UPPERCASE, STANDOUT, PARSE, RUNPARSE</td><td class=\"v\">more queries</td></tr>\n</table>\n\n<h3>Ch.3 &mdash; Objects</h3>\n<table>\n<tr><td class=\"k\">KINDOF, SOMETHING, ONEOF</td><td class=\"v\">constructors</td></tr>\n<tr><td class=\"k\">EXIST, HAVE, HAVEMAKE</td><td class=\"v\">mutators</td></tr>\n<tr><td class=\"k\">SELF, PARENTS, MYNAMES, MYNAMEP, MYPROCS, MYPROCP</td><td class=\"v\">selectors</td></tr>\n<tr><td class=\"k\">TALKTO, ASK</td><td class=\"v\">messages / changing current object</td></tr>\n<tr><td class=\"k\">WHOSENAME, WHOSEPROC</td><td class=\"v\">queries</td></tr>\n<tr><td class=\"k\">USUAL.foo</td><td class=\"v\">invoke inherited version of foo</td></tr>\n</table>\n\n<h3>Ch.4 &mdash; Communication</h3>\n<table>\n<tr><td class=\"k\">PRINT (PR), TYPE, SHOW</td><td class=\"v\">transmitters</td></tr>\n<tr><td class=\"k\">READLIST (RL), READWORD (RW), READRAWLINE</td><td class=\"v\">receivers</td></tr>\n<tr><td class=\"k\">READCHAR (RC), READCHARS (RCS), SHELL</td><td class=\"v\">more receivers</td></tr>\n<tr><td class=\"k\">SETPREFIX, PREFIX, OPENREAD, OPENWRITE, OPENAPPEND, OPENUPDATE</td><td class=\"v\">file access</td></tr>\n<tr><td class=\"k\">CLOSE, ALLOPEN, CLOSEALL, ERASEFILE (ERF)</td><td class=\"v\">more file access</td></tr>\n<tr><td class=\"k\">DRIBBLE, NODRIBBLE, SETREAD, SETWRITE</td><td class=\"v\">streams</td></tr>\n<tr><td class=\"k\">READER, WRITER, SETREADPOS, SETWRITEPOS, READPOS, WRITEPOS</td><td class=\"v\">stream position</td></tr>\n<tr><td class=\"k\">EOFP, FILEP</td><td class=\"v\">file predicates</td></tr>\n<tr><td class=\"k\">KEYP, LINEP, CLEARTEXT (CT)</td><td class=\"v\">terminal access</td></tr>\n<tr><td class=\"k\">SETCURSOR, CURSOR, SETMARGINS</td><td class=\"v\">cursor control</td></tr>\n<tr><td class=\"k\">SETTEXTCOLOR, INCREASEFONT, SETTEXTSIZE, SETFONT</td><td class=\"v\">wxWidgets text styling</td></tr>\n</table>\n\n<h3>Ch.5 &mdash; Arithmetic</h3>\n<table>\n<tr><td class=\"k\">SUM, DIFFERENCE, MINUS, PRODUCT, QUOTIENT</td><td class=\"v\">basic operations</td></tr>\n<tr><td class=\"k\">REMAINDER, MODULO, INT, ROUND, SQRT, POWER</td><td class=\"v\">more operations</td></tr>\n<tr><td class=\"k\">EXP, LOG10, LN</td><td class=\"v\">logs / exponent</td></tr>\n<tr><td class=\"k\">SIN, COS, ARCTAN / RADSIN, RADCOS, RADARCTAN</td><td class=\"v\">trig (degrees / radians)</td></tr>\n<tr><td class=\"k\">ISEQ, RSEQ</td><td class=\"v\">sequence generators</td></tr>\n<tr><td class=\"k\">LESSP, GREATERP, LESSEQUALP, GREATEREQUALP</td><td class=\"v\">numeric predicates</td></tr>\n<tr><td class=\"k\">RANDOM, RERANDOM</td><td class=\"v\">random numbers</td></tr>\n<tr><td class=\"k\">FORM</td><td class=\"v\">print formatting</td></tr>\n<tr><td class=\"k\">BITAND, BITOR, BITXOR, BITNOT, ASHIFT, LSHIFT</td><td class=\"v\">bitwise operations</td></tr>\n</table>\n\n<h3>Ch.6 &mdash; Logical Operations</h3>\n<table>\n<tr><td class=\"k\">AND, OR, NOT</td><td class=\"v\">short-circuiting booleans (list inputs = expressions)</td></tr>\n</table>\n\n<h3>Ch.7 &mdash; Graphics</h3>\n<table>\n<tr><td class=\"k\">FORWARD (FD), BACK (BK), LEFT (LT), RIGHT (RT)</td><td class=\"v\">turtle motion</td></tr>\n<tr><td class=\"k\">SETPOS, SETXY, SETX, SETY, SETHEADING (SETH), HOME, ARC</td><td class=\"v\">absolute motion</td></tr>\n<tr><td class=\"k\">POS, XCOR, YCOR, HEADING, TOWARDS, SCRUNCH</td><td class=\"v\">motion queries</td></tr>\n<tr><td class=\"k\">SHOWTURTLE (ST), HIDETURTLE (HT), CLEAN, CLEARSCREEN (CS)</td><td class=\"v\">turtle/window control</td></tr>\n<tr><td class=\"k\">WRAP, WINDOW, FENCE</td><td class=\"v\">boundary modes</td></tr>\n<tr><td class=\"k\">FILL, FILLED, LABEL, SETLABELHEIGHT</td><td class=\"v\">fills and labels</td></tr>\n<tr><td class=\"k\">TEXTSCREEN (TS), FULLSCREEN (FS), SPLITSCREEN (SS)</td><td class=\"v\">screen layout</td></tr>\n<tr><td class=\"k\">SETSCRUNCH, REFRESH, NOREFRESH</td><td class=\"v\">scaling and refresh</td></tr>\n<tr><td class=\"k\">SHOWNP, SCREENMODE, TURTLEMODE, LABELSIZE</td><td class=\"v\">window queries</td></tr>\n<tr><td class=\"k\">PENDOWN (PD), PENUP (PU), PENPAINT, PENERASE, PENREVERSE</td><td class=\"v\">pen state</td></tr>\n<tr><td class=\"k\">SETPENCOLOR (SETPC), SETPALETTE, SETPENSIZE, SETPEN, SETBACKGROUND (SETBG)</td><td class=\"v\">pen/background color</td></tr>\n<tr><td class=\"k\">PENDOWNP, PENMODE, PENCOLOR (PC), PALETTE, PENSIZE, PEN, BACKGROUND (BG)</td><td class=\"v\">pen queries</td></tr>\n<tr><td class=\"k\">SAVEPICT, LOADPICT, EPSPICT</td><td class=\"v\">saving/loading pictures</td></tr>\n<tr><td class=\"k\">MOUSEPOS, CLICKPOS, BUTTONP, BUTTON</td><td class=\"v\">mouse queries</td></tr>\n</table>\n\n<h3>Ch.8 &mdash; Workspace Management</h3>\n<table>\n<tr><td class=\"k\">TO, DEFINE, TEXT, FULLTEXT, COPYDEF</td><td class=\"v\">procedure definition</td></tr>\n<tr><td class=\"k\">MAKE, NAME, LOCAL, LOCALMAKE, THING, GLOBAL</td><td class=\"v\">variable definition</td></tr>\n<tr><td class=\"k\">PPROP, GPROP, REMPROP, PLIST</td><td class=\"v\">property lists</td></tr>\n<tr><td class=\"k\">PROCEDUREP, PRIMITIVEP, DEFINEDP, NAMEP, PLISTP</td><td class=\"v\">workspace predicates</td></tr>\n<tr><td class=\"k\">CONTENTS, BURIED, TRACED, STEPPED</td><td class=\"v\">contents lists</td></tr>\n<tr><td class=\"k\">PROCEDURES, PRIMITIVES, NAMES, PLISTS, ARITY, NODES</td><td class=\"v\">workspace queries</td></tr>\n<tr><td class=\"k\">PO, POALL, POPS, PONS, POPLS, PON, POPL, POT, POTS</td><td class=\"v\">workspace inspection</td></tr>\n<tr><td class=\"k\">ERASE (ER), ERALL, ERPS, ERNS, ERPLS, ERN, ERPL</td><td class=\"v\">erasing</td></tr>\n<tr><td class=\"k\">BURY, BURYALL, BURYNAME, UNBURY, UNBURYALL, BURIEDP</td><td class=\"v\">burying</td></tr>\n<tr><td class=\"k\">TRACE, UNTRACE, TRACEDP, STEP, UNSTEP, STEPPEDP</td><td class=\"v\">tracing/stepping</td></tr>\n<tr><td class=\"k\">EDIT (ED), EDITFILE, EDALL, EDPS, EDNS, EDPLS, EDN, EDPL</td><td class=\"v\">editing</td></tr>\n<tr><td class=\"k\">SAVE, SAVEL, LOAD, CSLSLOAD, HELP</td><td class=\"v\">saving/loading/help</td></tr>\n<tr><td class=\"k\">SETEDITOR, SETLIBLOC, SETCSLSLOC, SETHELPLOC, SETTEMPLOC</td><td class=\"v\">path configuration</td></tr>\n<tr><td class=\"k\">GC, .SETSEGMENTSIZE</td><td class=\"v\">memory management</td></tr>\n</table>\n\n<h3>Ch.9 &mdash; Control Structures</h3>\n<table>\n<tr><td class=\"k\">RUN, RUNRESULT, REPEAT, FOREVER, REPCOUNT (#)</td><td class=\"v\">basic control</td></tr>\n<tr><td class=\"k\">IF, IFELSE, TEST, IFTRUE (IFT), IFFALSE (IFF)</td><td class=\"v\">conditionals</td></tr>\n<tr><td class=\"k\">STOP, OUTPUT (OP)</td><td class=\"v\">ending a procedure</td></tr>\n<tr><td class=\"k\">CATCH, THROW, ERROR</td><td class=\"v\">error/exception handling</td></tr>\n<tr><td class=\"k\">PAUSE, CONTINUE (CO), WAIT, BYE</td><td class=\"v\">interactive control</td></tr>\n<tr><td class=\"k\">.MAYBEOUTPUT, GOTO, TAG, IGNORE, ` (backquote)</td><td class=\"v\">advanced control</td></tr>\n<tr><td class=\"k\">FOR, WHILE, DO.WHILE, UNTIL, DO.UNTIL</td><td class=\"v\">loops (library)</td></tr>\n<tr><td class=\"k\">CASE, COND</td><td class=\"v\">multi-branch conditionals (library)</td></tr>\n<tr><td class=\"k\">APPLY, INVOKE, FOREACH</td><td class=\"v\">template application</td></tr>\n<tr><td class=\"k\">MAP, MAP.SE, FILTER, FIND, REDUCE</td><td class=\"v\">iteration tools</td></tr>\n<tr><td class=\"k\">CROSSMAP, CASCADE, CASCADE.2, TRANSFER</td><td class=\"v\">advanced iteration tools</td></tr>\n</table>\n\n<h3>Ch.10 &mdash; Macros</h3>\n<table>\n<tr><td class=\"k\">.MACRO, .DEFMACRO</td><td class=\"v\">define a macro</td></tr>\n<tr><td class=\"k\">MACROP, MACROEXPAND</td><td class=\"v\">macro predicates/debugging</td></tr>\n</table>\n\n<h3>Ch.11 &mdash; Error Processing</h3>\n<table>\n<tr><td class=\"k\">ERRACT</td><td class=\"v\">instructionlist run on error</td></tr>\n<tr><td class=\"k\">Codes 0, 32, 34</td><td class=\"v\">uncatchable fatal errors</td></tr>\n<tr><td class=\"k\">Codes 4-43</td><td class=\"v\">full catchable error table (see lesson)</td></tr>\n</table>\n\n<h3>Ch.12 &mdash; Special Variables</h3>\n<table>\n<tr><td class=\"k\">ALLOWGETSET, CASEIGNOREDP, UNBURYONEDIT</td><td class=\"v\">TRUE &amp; buried by default</td></tr>\n<tr><td class=\"k\">BUTTONACT, KEYACT</td><td class=\"v\">event handler instructionlists</td></tr>\n<tr><td class=\"k\">ERRACT, LOADNOISILY, REDEFP, STARTUP</td><td class=\"v\">behavior toggles</td></tr>\n<tr><td class=\"k\">FULLPRINTP, PRINTDEPTHLIMIT, PRINTWIDTHLIMIT</td><td class=\"v\">print formatting toggles</td></tr>\n<tr><td class=\"k\">USEALTERNATENAMES, LOGOVERSION, LOGOPLATFORM</td><td class=\"v\">i18n / version info</td></tr>\n</table>\n\n<h3>Ch.13 &mdash; Internationalization</h3>\n<table>\n<tr><td class=\"k\">COPYDEF \"alias \"PRIMITIVE</td><td class=\"v\">alias a primitive name</td></tr>\n<tr><td class=\"k\">Messages file</td><td class=\"v\">translatable system messages (%p %s %t)</td></tr>\n<tr><td class=\"k\">USEALTERNATENAMES</td><td class=\"v\">generate alternate-language output</td></tr>\n</table>\n";


/* ================= APP LOGIC ================= */
let currentIndex = 0;
const progress = new Set();

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'grp-label';
  label.textContent = 'Contents';
  sb.appendChild(label);
  LESSONS.forEach((l, i) => {
    const el = document.createElement('div');
    el.className = 'lesson-item' + (i === currentIndex ? ' active' : '');
    el.setAttribute('role','button');
    el.tabIndex = 0;
    el.innerHTML = `<span class="num">${l.num}</span><span>${l.title}</span><span class="chk">${progress.has(l.id) ? '✓' : ''}</span>`;
    el.addEventListener('click', () => loadLesson(i));
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); loadLesson(i);} });
    sb.appendChild(el);
  });
}

function renderBody(block){
  if(block.t === 'p') return `<p>${block.v}</p>`;
  if(block.t === 'code') return `<div class="codebox"><div class="cb-head">LOGO</div><pre>${highlight(block.v)}</pre></div>`;
  return '';
}

function renderQuiz(lesson){
  if(!lesson.quiz || !lesson.quiz.length) return '';
  let html = '';
  lesson.quiz.forEach((q, qi) => {
    const name = `${lesson.id}-q${qi}`;
    html += `<div class="quiz">
      <div class="qhead">QUICK CHECK ${qi+1} / ${lesson.quiz.length}</div>
      <div class="qtext">${q.q}</div>`;
    q.opts.forEach((opt, oi) => {
      html += `<label><input type="radio" name="${name}" value="${oi}"> ${opt}</label>`;
    });
    html += `<button class="qbtn" data-name="${name}" data-answer="${q.a}" data-ex="${encodeURIComponent(q.ex)}" data-lesson="${lesson.id}">Check answer</button>
      <div class="qresult" id="res-${name}"></div>
    </div>`;
  });
  return html;
}

function loadLesson(i){
  currentIndex = i;
  const lesson = LESSONS[i];
  document.getElementById('titlebar').innerHTML = `<b>UCB Logo</b> &nbsp;&rsaquo;&nbsp; Chapter ${lesson.num}`;
  const scroll = document.getElementById('content-scroll');
  let html = `<h2>${lesson.num}. ${lesson.title}</h2><p class="subtitle">${lesson.subtitle}</p>`;
  lesson.body.forEach(b => html += renderBody(b));
  html += renderQuiz(lesson);
  scroll.innerHTML = html;
  scroll.scrollTop = 0;
  attachQuizHandlers(lesson);
  renderSidebar();
  updateStatus();
}

function attachQuizHandlers(lesson){
  document.querySelectorAll('.qbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.getAttribute('data-name');
      const answer = parseInt(btn.getAttribute('data-answer'), 10);
      const ex = decodeURIComponent(btn.getAttribute('data-ex'));
      const lessonId = btn.getAttribute('data-lesson');
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      const resBox = document.getElementById(`res-${name}`);
      if(!checked){
        resBox.className = 'qresult bad';
        resBox.textContent = 'Select an answer first.';
        return;
      }
      const chosen = parseInt(checked.value, 10);
      if(chosen === answer){
        resBox.className = 'qresult ok';
        resBox.textContent = '✓ Correct — ' + ex;
        checkLessonComplete(lessonId);
      } else {
        resBox.className = 'qresult bad';
        resBox.textContent = '✗ Not quite — ' + ex;
      }
    });
  });
}

function checkLessonComplete(lessonId){
  const lesson = LESSONS.find(l => l.id === lessonId);
  const allCorrect = lesson.quiz.every((q, qi) => {
    const resBox = document.getElementById(`res-${lessonId}-q${qi}`);
    return resBox && resBox.classList.contains('ok');
  });
  if(allCorrect && !progress.has(lessonId)){
    progress.add(lessonId);
    renderSidebar();
    updateStatus();
  }
}

function updateStatus(){
  document.getElementById('sb-progress').textContent =
    `Lesson ${currentIndex+1}/${LESSONS.length}   Progress: ${progress.size}/${LESSONS.length} ✓`;
}

/* ---- modal / help ---- */
function openModal(){
  document.getElementById('modal-body').innerHTML = REFERENCE;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}
document.getElementById('mi-help').addEventListener('click', openModal);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if(e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('sb-f1').addEventListener('click', openModal);
document.getElementById('sb-prev').addEventListener('click', () => {
  if(currentIndex > 0) loadLesson(currentIndex - 1);
});
document.getElementById('sb-next').addEventListener('click', () => {
  if(currentIndex < LESSONS.length - 1) loadLesson(currentIndex + 1);
});
document.addEventListener('keydown', e => {
  if(e.key === 'F1'){ e.preventDefault(); openModal(); }
  if(e.key === 'F2'){ e.preventDefault(); if(currentIndex > 0) loadLesson(currentIndex - 1); }
  if(e.key === 'F3'){ e.preventDefault(); if(currentIndex < LESSONS.length - 1) loadLesson(currentIndex + 1); }
  if(e.key === 'Escape'){ closeModal(); }
});

/* ---- init ---- */
renderSidebar();
loadLesson(0);
</script>
</body>
</html>
